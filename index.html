<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitor de Precios</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0F1417; color: #E7ECF0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }

    #sidebar {
      width: 260px; min-width: 260px;
      border-right: 1px solid #262E35;
      display: flex; flex-direction: column;
    }
    #sidebar-header { padding: 20px; border-bottom: 1px solid #262E35; }
    #sidebar-header small { color: #7C8894; font-size: 12px; }
    #sidebar-header h2 { font-size: 18px; margin-top: 4px; }
    #product-list { flex: 1; overflow-y: auto; }
    .product-btn {
      width: 100%; text-align: left; padding: 14px 20px;
      background: transparent; border: none; border-left: 2px solid transparent;
      cursor: pointer; color: #E7ECF0; display: block;
    }
    .product-btn:hover { background: #161C21; }
    .product-btn.active { background: #161C21; border-left-color: #5EEAD4; }
    .product-btn .nombre { font-size: 13px; margin-bottom: 5px; line-height: 1.3; }
    .product-btn .precio-row { display: flex; align-items: center; gap: 6px; font-family: monospace; font-size: 13px; }
    .badge-baja { color: #5EEAD4; }
    .badge-sube { color: #F27059; }
    .badge-igual { color: #7C8894; }
    #loading { padding: 20px; color: #7C8894; font-size: 14px; }

    #main { flex: 1; padding: 28px 32px; display: flex; flex-direction: column; overflow: hidden; }
    #main-title small { color: #7C8894; font-size: 12px; }
    #main-title h1 { font-size: 18px; margin-top: 4px; margin-bottom: 24px; line-height: 1.3; }
    #chart-container { flex: 1; min-height: 0; position: relative; }
    #registros { margin-top: 16px; border-top: 1px solid #262E35; padding-top: 14px; }
    #registros small { color: #7C8894; font-size: 12px; display: block; margin-bottom: 8px; }
    #registros-lista { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-family: monospace; font-size: 12px;
      background: #161C21; border: 1px solid #262E35;
      padding: 3px 10px; border-radius: 6px; color: #7C8894;
    }
    .chip span { color: #E7ECF0; }
    #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #7C8894; text-align: center; font-size: 14px; }
  </style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <small>Monitor de precios</small>
    <h2>Productos rastreados</h2>
  </div>
  <div id="product-list">
    <div id="loading">Cargando datos...</div>
  </div>
</div>

<div id="main">
  <div id="empty">Selecciona un producto de la lista.</div>
  <div id="main-title" style="display:none">
    <small>Historial de precio</small>
    <h1 id="titulo-producto"></h1>
  </div>
  <div id="chart-container" style="display:none">
    <canvas id="myChart"></canvas>
  </div>
  <div id="registros" style="display:none">
    <small id="registros-label"></small>
    <div id="registros-lista"></div>
  </div>
</div>

<script>
  let chart = null;
  let productos = {};

  // Lee el JSON del mismo repositorio
  fetch('price_history.json')
    .then(r => r.json())
    .then(data => {
      // Agrupar por producto
      data.forEach(r => {
        if (!productos[r.titulo]) productos[r.titulo] = [];
        productos[r.titulo].push(r);
      });
      Object.values(productos).forEach(lista =>
        lista.sort((a, b) => new Date(a.fecha) - new Date(b.fecha))
      );
      renderSidebar();
      // Seleccionar el primero automáticamente
      const primero = Object.keys(productos)[0];
      if (primero) seleccionar(primero);
    })
    .catch(() => {
      document.getElementById('loading').textContent = 'Error al cargar price_history.json';
    });

  function renderSidebar() {
    const lista = document.getElementById('product-list');
    lista.innerHTML = '';
    Object.entries(productos).forEach(([titulo, registros]) => {
      const ultimo = registros[registros.length - 1];
      const anterior = registros.length > 1 ? registros[registros.length - 2] : null;
      const delta = anterior ? ultimo.precio - anterior.precio : 0;
      const simbolo = delta < 0 ? '▼' : delta > 0 ? '▲' : '—';
      const clase = delta < 0 ? 'badge-baja' : delta > 0 ? 'badge-sube' : 'badge-igual';

      const btn = document.createElement('button');
      btn.className = 'product-btn';
      btn.dataset.titulo = titulo;
      btn.innerHTML = `
        <div class="nombre">${titulo.length > 38 ? titulo.slice(0,38)+'…' : titulo}</div>
        <div class="precio-row">
          <span>$${ultimo.precio.toFixed(2)}</span>
          <span class="${clase}">${simbolo} ${delta !== 0 ? Math.abs(delta).toFixed(2) : ''}</span>
        </div>`;
      btn.addEventListener('click', () => seleccionar(titulo));
      lista.appendChild(btn);
    });
  }

  function seleccionar(titulo) {
    document.querySelectorAll('.product-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.titulo === titulo)
    );

    const registros = productos[titulo];
    const labels = registros.map(r => r.fecha.slice(5,10));
    const valores = registros.map(r => r.precio);

    document.getElementById('empty').style.display = 'none';
    document.getElementById('main-title').style.display = 'block';
    document.getElementById('chart-container').style.display = 'block';
    document.getElementById('registros').style.display = 'block';
    document.getElementById('titulo-producto').textContent = titulo;

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('myChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Precio',
          data: valores,
          borderColor: '#5EEAD4',
          backgroundColor: 'rgba(94,234,212,0.08)',
          pointBackgroundColor: '#5EEAD4',
          pointRadius: 4,
          tension: 0.3,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#161C21',
            borderColor: '#262E35',
            borderWidth: 1,
            titleColor: '#7C8894',
            bodyColor: '#E7ECF0',
            callbacks: { label: ctx => ` $${ctx.parsed.y}` }
          }
        },
        scales: {
          x: { grid: { color: '#262E35' }, ticks: { color: '#7C8894' } },
          y: { grid: { color: '#262E35' }, ticks: { color: '#7C8894', callback: v => `$${v}` } }
        }
      }
    });

    document.getElementById('registros-label').textContent = `Registros (${registros.length})`;
    const chips = document.getElementById('registros-lista');
    chips.innerHTML = registros.map(r =>
      `<div class="chip">${r.fecha.slice(5,10)}: <span>$${r.precio}</span></div>`
    ).join('');
  }
</script>
</body>
</html>
